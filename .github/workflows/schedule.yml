name: Tarefa Agendada - API 1 Health Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer requisição para minha API a cada 10 minutos
        run: |
          echo "calling API..."
          curl --fail --show-error --silent \
            --max-time 120 \
            https://springboot-rest-2575.onrender.com/
          echo "API answered!"
          
