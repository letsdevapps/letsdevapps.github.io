<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="css/index-test-1.css">

    <title>Início</title>
</head>
<body>
    <nav id="menu"></nav>

    <main class="hero">
        <p>OLÁ, VISITANTE</p>
        <h1>#<span id="contador">000000</span></h1>

        <p class="descricao">
            Bem-vindo ao meu espaço na internet.
            Aqui vou colocar uma apresentação sobre mim,
            meus projetos, meu trabalho ou qualquer coisa que queira mostrar.
            <br><br>
            Obrigado por todas as mensagens positivas de apoio.
        </p>
        
        <a class="botao" href="#">
            Conheça meu trabalho
        </a>
    </main>

    <footer id="footer"></footer>
    <script src="components/menu.js"></script>
    <script src="components/footer.js"></script>
    <script>
    const contador = document.getElementById("contador");

    let visitorId = localStorage.getItem("visitor_id");
/*
    if (!visitorId) {
        visitorId = crypto.randomUUID(); //não funcionou no brave, depois eu vejo
        localStorage.setItem("visitor_id", visitorId);
    }
*/
    if (!visitorId) {
        visitorId =
            Date.now().toString(36) +
            Math.random().toString(36).substring(2) +
            Math.random().toString(36).substring(2);

        localStorage.setItem("visitor_id", visitorId);
    }

    fetch(
        `https://test-counter-worker.letsdevapps.workers.dev/count?visitor_id=${encodeURIComponent(visitorId)}`
    )
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return response.json();
        })
        .then(data => {
            contador.textContent = String(data.visits).padStart(6, "0");
        })
        .catch(error => {
            console.error("Erro ao carregar contador:", error);
            contador.textContent = "------";
        });
    </script>
</body>
</html>
